document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-family:'Cormorant Garamond',serif;font-size:clamp(32px,3.2vw,42px);font-weight:400;color:#2E2A28;line-height:1.05\">{{ packA }}<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:11px;font-size:14px;color:#5C534E;flex:1 1 auto\">\n        <span style=\"display:flex;gap:10px\"><span style=\"color:#C9A9A6\">—<\u002Fspan>Location robe (3 jours)<\u002Fspan>\n        <span style=\"display:flex;gap:10px\"><span style=\"color:#C9A9A6\">—<\u002Fspan>Voile et bijoux assortis<\u002Fspan>\n        <span style=\"display:flex;gap:10px\"><span style=\"color:#C9A9A6\">—<\u002Fspan>Coiffure du jour J<\u002Fspan>\n        <span style=\"display:flex;gap:10px\"><span style=\"color:#C9A9A6\">—<\u002Fspan>Retouches et repassage<\u002Fspan>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ openBooking }}\" style=\"padding:12px 24px;border-radius:999px;border:1px solid #8B6F7D;color:#8B6F7D;font-size:14px;cursor:pointer;transition:background .25s ease,color .25s ease\" style-hover=\"background:#8B6F7D;color:#FFFFFF\">Choisir Essential<\u002Fbutton>\n    <\u002Farticle>\n\n    <article style=\"position:relative;display:flex;flex-direction:column;gap:18px;padding:clamp(30px,2.8vw,40px);border-radius:28px;background:#8B6F7D;color:#FBF8F7;box-shadow:0 34px 80px rgba(139,111,125,.34)\">\n      <span style=\"position:absolute;top:-13px;inset-inline-start:clamp(30px,2.8vw,40px);padding:6px 16px;border-radius:999px;background:#D4B896;color:#2E2A28;font-size:10px;letter-spacing:.22em;text-transform:uppercase\">Le plus choisi<\u002Fspan>\n      <div>\n        <p style=\"margin:0;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:#EBD8CF\">Signature<\u002Fp>\n        <p style=\"margin:8px 0 0;font-family:'Cormorant Garamond',serif;font-size:clamp(36px,3.8vw,50px);font-weight:400;line-height:1.05\">{{ packB }}<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:11px;font-size:14px;color:#F6ECE8;flex:1 1 aut :10px\"><span style=\"color:#D4B896\">—<\u002Fspan>Retouches sur place le jour J<\u002Fspan>\n        <span style=\"display:flex;gap:10px\"><span style=\"color:#D4B896\">—<\u002Fspan>Shooting studio 1 h<\u002Fspan>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ openBooking }}\" style=\"padding:12px 24px;border-radius:999px;border:1px solid #8B6F7D;color:#8B6F7D;font-size:14px;cursor:pointer;transition:background .25s ease,color .25s ease\" style-hover=\"background:#8B6F7D;color:#FFFFFF\">Choisir Couture<\u002Fbutton>\n    <\u002Farticle>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"tarifs\" style=\"padding:clamp(56px,6vw,104px) clamp(20px,4vw,56px);background:#FBF8F7;border-block:1px solid rgba(201,169,166,.28);animation:nsReveal linear both;animation-timeline:view();animation-range:entry 3% entry 40%\">\n  <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-block-end:clamp(24px,3vw,40px)\">\n    <div style=\"max-width:52ch\">\n      <p style=\"margin:0 0 14px;display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#A08D82\"><span style=\"color:#D4B896;font-size:13px\">✦<\u002Fspan>Tarifs 2026<\u002Fp>\n      <h2 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(32px,4.2vw,56px);line-height:1.05;letter-spacing:-.02em;color:#2E2A28\">La carte complète, sans <span style=\"font-family:'Parisienne',cursive;font-size:1.14em;color:#A8899A;display:inline-block;transform:translateY(.1em)\">surprise.<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <label style=\"display:flex;align-items:center;gap:10px;flex:1 1 260px;max-width:340px;padding:12px 18px;border-radius:999px;background:#FFFFFF;border:1px solid rgba(201,169,166,.5)\">\n      <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#A08D82\" stroke-width=\"1.6\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"6.5\"><\u002Fcircle><path d=\"M16 16l4 4\"><\u002Fpath><\u002Fsvg>\n      <input value=\"{{ searchVal }}\" sc-camel-on-change=\"{{ setSearch }}\" placeholder=\"Rechercher une prestation…\" style=\"border:none;outline:none;background:transparent;font-size:14px;width:100%\">\n    <\u002Flabel>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:8px;max-width:1000px\">\n    <sc-for list=\"{{ groups }}\" as=\"g\" hint-placeholder-count=\"6\">\n      <div style=\"border-radius:22px;background:#FFFFFF;border:1px solid rgba(201,169,166,.32);overflow:hidden\">\n        <button sc-camel-on-click=\"{{ g.click }}\" style=\"display:flex;align-items:center;gap:16px;width:100%;padding:18px 24px;cursor:pointer;text-align:start\">\n          <span style=\"font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:400;color:#2E2A28;margin-inline-end:auto\">{{ g.g }}<\u002Fspan>\n          <span style=\"font-size:11px;letter-spacing:.14em;color:#A08D82\">{{ g.count }}<\u002Fspan>\n          <span style=\"display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#F3EAE7;color:#8B6F7D\">\n            <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{ g.chev }}\"><\u002Fpath><\u002Fsvg>\n          <\u002Fspan>\n        <\u002Fbutton>\n        <sc-if value=\"{{ g.open }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;padding:0 24px 8px\">\n            <sc-for list=\"{{ g.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;align-items:baseline;gap:16px;padding:13px 0;border-top:1px dotted rgba(201,169,166,.55)\">\n                <span style=\"font-size:15px;color:#2E2A28\">{{ it.name }}<\u002Fspan>\n                <span style=\"flex:1 1 auto;height:1px;background:repeating-linear-gradient(90deg,rgba(201,169,166,.6) 0 2px,transparent 2px 6px)\"><\u002Fspan>\n                <span style=\"font-size:12px;color:#A08D82;text-align:end;max-width:34ch\">{{ it.dur }}<\u002Fspan>\n                <sc-if value=\"{{ showPrices }}\" hint-placeholder-val=\"{{ true }}\">\n                  <span style=\"font-family:'Cormorant Garamond',serif;font-size:19px;color:#8B6F7D;white-space:nowrap\">{{ it.price }}<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <p style=\"margin:20px 0 0;font-size:13px;color:#A08D82\">Prix en dinars algériens, TTC. Les forfaits mariée sont personnalisables sur rendez-vous.<\u002Fp>\n<\u002Fsection>\n\n<section id=\"soeurs\" style=\"padding:clamp(56px,6vw,110px) clamp(20px,4vw,56px);background:#F7F3F0;animation:nsReveal linear both;animation-timeline:view();animation-range:entry 3% entry 40%\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:clamp(24px,3.5vw,60px);align-items:center\">\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n      <div style=\"aspect-ratio:3/4;border-radius:24px 24px 120px 24px;overflow:hidden;background:#E8D5D0\">\n        <image-slot id=\"ns-nour\" shape=\"rect\" fit=\"cover\" placeholder=\"Portrait éditorial — Nour\"><\u002Fimage-slot>\n      <\u002Fdiv>\n      <div style=\"aspect-ratio:3/4;border-radius:120px 24px 24px 24px;overflow:hidden;background:#E8D5D0;transform:translateY(34px)\">\n        <image-slot id=\"ns-sophie\" shape=\"rect\" fit=\"cover\" placeholder=\"Portrait éditorial — Sophie\"><\u002Fimage-slot>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width:54ch\">\n      <p style=\"margin:0 0 14px;display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#A08D82\"><span style=\"color:#D4B896;font-size:13px\">✦<\u002Fspan>Nour &amp; Sophie<\u002Fp>\n      <h2 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(32px,4.4vw,58px);line-height:1.05;letter-spacing:-.02em;color:#2E2A28\">Deux sœurs, une même <span style=\"font-family:'Parisienne',cursive;font-size:1.14em;color:#A8899A;display:inline-block;transform:translateY(.1em)\">exigence.<\u002Fspan><\u002Fh2>\n      <p style=\"margin:20px 0 0;font-size:16px;color:#5C534E;text-wrap:pretty\">Nous avons ouvert notre premier fauteuil à Constantine en 2018, dans une pièce de trente mètres carrés. Aujourd'hui l'institut réunit quinze expertes, un salon de coiffure, une cabine de soins et un showroom de robes — et nous coiffons toujours nous-mêmes chaque mariée.<\u002Fp>\n      <p style=\"margin:16px 0 0;font-size:16px;color:#5C534E;text-wrap:pretty\">Nour tient les ciseaux et le chignon. Sophie tient la peau et la lumière. Ce que nous partageons : l'idée qu'une femme doit sortir d'ici plus sûre d'elle qu'en entrant.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:28px;margin-block-start:30px;padding-block-start:26px;border-top:1px solid rgba(201,169,166,.45)\">\n        <div><p style=\"margin:0;font-family:'Cormorant Garamond',serif;font-size:32px;color:#8B6F7D;line-height:1\">2018<\u002Fp><p style=\"margin:2px 0 0;font-size:12px;letter-spacing:.1em;color:#A08D82\">Premier fauteuil<\u002Fp><\u002Fdiv>\n        <div><p style=\"margin:0;font-family:'Cormorant Garamond',serif;font-size:32px;color:#8B6F7D;line-height:1\">340 k<\u002Fp><p style=\"margin:2px 0 0;font-size:12px;letter-spacing:.1em;color:#A08D82\">Communauté Instagram<\u002Fp><\u002Fdiv>\n        <div><p style=\"margin:0;font-family:'Cormorant Garamond',serif;font-size:32px;color:#8B6F7D;line-height:1\">180+<\u002Fp><p style=\"margin:2px 0 0;font-size:12px;letter-spacing:.1em;color:#A08D82\">Mariées accompagnées<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:clamp(56px,6vw,104px) clamp(20px,4vw ckground:#8B6F7D;color:#FFFFFF\">Mon rendez-vous<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:clamp(56px,6vw,104px) clamp(20px,4vw,56px);background:#F7F3F0;animation:nsReveal linear both;animation-timeline:view();animation-range:entry 3% entry 40%\">\n  <div style=\"max-width:56ch;margin-block-end:clamp(26px,3vw,42px)\">\n    <p style=\"margin:0 0 14px;display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#A08D82\"><span style=\"color:#D4B896;font-size:13px\">✦<\u002Fspan>Elles en parlent<\u002Fp>\n    <h2 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(32px,4.2vw,56px);line-height:1.05;letter-spacing:-.02em;color:#2E2A28\">Ce que nos clientes <span style=\"font-family:'Parisienne',cursive;font-size:1.14em;color:#A8899A;display:inline-block;transform:translateY(.1em)\">racontent.<\u002Fspan><\u002Fh2>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:clamp(14px,1.8vw,24px)\">\n    <figure style=\"margin:0;display:flex;flex-direction:column;gap:18px;padding:clamp(24px,2.2vw,32px);border-radius:26px;background:#FBF8F7;border:1px solid rgba(201,169,166,.32)\">\n      <span style=\"font-family:'Cormorant Garamond',serif;font-size:44px;color:#C9A9A6;line-height:.6\">“<\u002Fspan>\n      <blockquote style=\"margin:0;font-size:16px;color:#4A423E;text-wrap:pretty\">J'ai loué ma robe chez elles en juin. Le prix était affiché, ma taille était disponible, et les retouches étaient déjà comprises. Aucune mauvaise surprise à trois semaines du mariage.<\u002Fblockquote>\n      <figcaption style=\"display:flex;align-items:center;gap:14px;margin-block-start:auto\">\n        <span style=\"width:46px;height:46px;border-radius:50%;overflow:hidden;background:#E8D5D0;flex:0 0 auto\"><image-slot id=\"ns-av-1\" shape=\"circle\" fit=\"cover\" placeholder=\"Photo\"><\u002Fimage-slot><\u002Fspan>\n        <span><span style=\"display:block;font-size:14px;color:#2E2A28\">Meriem B.<\u002Fspan><span style=\"display:block;font-size:12px;color:#A08D82\">Mariée, juin 2025<\u002Fspan><\u002Fspan>\n      <\u002Ffigcaption>\n    <\u002Ffigure>\n    <figure style=\"margin:0;display:flex;flex-direction:column;gap:18px;padding:clamp(24px,2.2vw,32px);border-radius:26px;background:#FBF8F7;border:1px solid rgba(201,169,166,.32)\">\n      <span style=\"font-family:'Cormorant Garamond',serif;font-size:44px;color:#C9A9A6;line-height:.6\">“<\u002Fspan>\n      <blockquote style=\"margin:0;font-size:16px;color:#4A423E;text-wrap:pretty\">Sophie a sauvé ma peau avant mes fiançailles. Trois séances, un vrai diagnostic, et des conseils que je suis encore aujourd'hui. On sent qu'elles aiment ce qu'elles font.<\u002Fblockquote>\n      <figcaption style=\"display:flex;align-items:center;gap:14px;margin-block-start:auto\">\n        <span style=\"width:46px;height:46px;border-radius:50%;overflow:hidden;background:#E8D5D0;flex:0 0 auto\"><image-slot id=\"ns-av-2\" shape=\"circle\" fit=\"cover\" placeholder=\"Photo\"><\u002Fimage-slot><\u002Fspan>\n        <span><span style=\"display:block;font-size:14px;color:#2E2A28\">Yasmine K.<\u002Fspan><span style=\"display:block;font-size:12px;color:#A08D82\">Soin visage · Nouvelle Ville<\u002Fspan><\u002Fspan>\n      <\u002Ffigcaption>\n    <\u002Ffigure>\n    <figure style=\"margin:0;display:flex;flex-direction:column;gap:18px;padding:clamp(24px,2.2vw,32px);border-radius:26px;background:#FBF8F7;border:1px solid rgba(201,169,166,.32)\">\n      <span style=\"font-family:'Cormorant Garamond',serif;font-size:44px;color:#C9A9A6;line-height:.6\">“<\u002Fspan>\n      <blockquote style=\"margin:0;font-size:16px;color:#4A423E;text-wrap:pretty\">Je réserve par WhatsApp depuis deux ans, jamais un retard. Nour connaît mes cheveux mieux que moi. C'est le seul salon de Constantine où j'emmène ma mère et mes sœurs.<\u002Fblockquote>\n "round\" stroke-linejoin=\"round\"><path d=\"M9.5 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:11px;letter-spacing:.1em;color:#A08D82;text-align:center;padding-block-end:4px\"><span>D<\u002Fspan><span>L<\u002Fspan><span>M<\u002Fspan><span>M<\u002Fspan><span>J<\u002Fspan><span>V<\u002Fspan><span>S<\u002Fspan><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:2px\">\n                <sc-for list=\"{{ cells }}\" as=\"c\" hint-placeholder-count=\"42\">\n                  <button sc-camel-on-click=\"{{ c.click }}\" style=\"{{ c.style }}\">{{ c.n }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <p style=\"margin:10px 0 0;font-size:11px;color:#A08D82\">Vendredi fermé · les dates barrées sont complètes<\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <p style=\"margin:0 0 10px;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#A08D82\">Créneaux — {{ dateLabel }}<\u002Fp>\n              <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n                <sc-for list=\"{{ slotList }}\" as=\"t\" hint-placeholder-count=\"7\">\n                  <button sc-camel-on-click=\"{{ t.click }}\" style=\"{{ t.style }}\">{{ t.t }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ atDetails }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:16px\">\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px\">\n              <label style=\"display:flex;flex-direction:column;gap:7px\">\n                <span style=\"font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#A08D82\">Nom complet<\u002Fspan>\n   {cat:'Massage', name:'Massage Relaxant', price:3000, dur:'1 h', desc:'Huiles chaudes à la fleur d\\'oranger.'},\n  {cat:'Massage', name:'Massage Mariée', price:4200, dur:'1 h 15', desc:'La veille du grand jour, dos et nuque.'}\n];\nconst CATS = ['Tout','Coiffure','Soins Capillaires','Soin de Visage','Nails','Pédicure','Extension de Cils','Épilation','Massage'];\nconst GOWNS = [\n  {n:'Anastasia', s:'36 – 42', p:45000, tier:'Signature'},\n  {n:'ABir', s:'38 – 44', p:38000, tier:'Essential'},\n  {n:'RYMA', s:'36 – 40', p:55000, tier:'Couture'}\n];\nconst EXPERTS = [\n  {n:'Nour', r:'Coiffure & mariée'},\n  {n:'Sophie', r:'Soins & visage'},\n  {n:'Amina', r:'Nails & cils'},\n  {n:'Lynda', r:'Massage & épilation'}\n];\nconst SLOTS = ['09:00','10:30','12:00','14:00','15:30','17:00','18:30'];\nconst STEPS = ['Le service','Votre experte','Date & heure','Vos coordonnées','Confirmation'];\n\nclass Component extends DCLogic {\n  rootRef = React.createRef();\n  heroRef = React.createRef();\n  stickyRef = React.createRef();\n  baRef = React.createRef();\n  baTopRef = React.createRef();\n  baHandleRef = React.createRef();\n\n  state = {lang:null, cat:'Tout', open:false, step:0, svc:null, expert:null, date:null, time:null,\n           nm:'', ph:'', nt:'', mOff:0, wOff:0, q:'', grp:'Coiffure'};\n\n  get lang(){ return this.state.lang || this.props.initialLanguage || 'fr'; }\n  get prices(){ return this.props.showPrices !== false; }\n\n  fmt(n){ return String(n).replace(/\\B(?=(\\d{3})+(?!\\d))/g,' ') + ' DA'; }\n  hash(s){ let h=7; for(let i=0;i<s.length;i++) h=(h*31 + s.charCodeAt(i))>>>0; return h; }\n  iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }\n  monthStart(){ const t=new Date(); return new Date(t.getFullYear(), t.getMonth()+this.state.mOff, 1); }\n  slotsOf(iso){ return SLOTS.map(t=>({t, taken:this.hash(iso+t)%4===0})); }\n\n  componentDidMount(){\n    this.applyLang();\n    const rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    const fine = window.matchMedia('(pointer:fine)').matches;\n    if((this.props.heroMotion||'immersive')==='immersive' && !rm && fine){\n      this.tx=0; this.ty=0; this.cx=0; this.cy=0;\n      this.onMove = e => { this.tx=(e.clientX/window.innerWidth-.5)*2; this.ty=(e.clientY/window.innerHeight-.5)*2; };\n      window.addEventListener('mousemove', this.onMove, {passive:true});\n      const tick = () => {\n        this.cx += (this.tx-this.cx)*.045; this.cy += (this.ty-this.cy)*.045;\n        const el = this.heroRef.current;\n        if(el) el.style.transform = 'translate3d('+(-this.cx*16).toFixed(2)+'px,'+(-this.cy*11).toFixed(2)+'px,0) scale(1.05)';\n        this.raf = requestAnimationFrame(tick);\n      };\n      tick();\n    }\n    this.onScroll = () => {\n      const el = this.stickyRef.current; if(!el) return;\n      const on = window.scrollY > 620;\n      el.style.opacity = on ? '1' : '0';\n      el.style.transform = on ? 'translate(-50%,0)' : 'translate(-50%,150%)';\n      el.style.pointerEvents = on ? 'auto' : 'none';\n    };\n    window.addEventListener('scroll', this.onScroll, {passive:true});\n    this.onScroll();\n    this.initSlider();\n  }\n  componentDidUpdate(){ this.applyLang(); this.initSlider(); }\n  componentWillUnmount(){\n    window.removeEventListener('mousemove', this.onMove);\n    window.removeEventListener('scroll', this.onScroll);\n    cancelAnimationFrame(this.raf);\n  }\n  applyLang(){\n    const el = this.rootRef.current; if(!el) return;\n    const ar = this.lang==='ar';\n    el.dir = ar ? 'rtl' : 'ltr';\n    el.style.fontFamily = ar ? \"'Noto Kufi Arabic','Jost',sans-serif\" : \"'Jost',system-ui,sans-serif\";\n    el.style.lineHeight = ar ? '1.95' : '1.65';\n  }\n  initSlider(){\n    const handle = this.baHandleRef.current, box = this.baRef.current;\n    if(!handle || !box || this._slider) return;\n    this._slider = true;\n    const set = p => {\n      p = Math.max(3, Math.min(97, p));\n      if(this.baTopRef.current) this.baTopRef.current.style.clipPath = 'inset(0 '+(100-p)+'% 0 0)';\n      handle.style.left = p+'%';\n    };\n    let down = false;\n    const move = e => { const r = box.getBoundingClientRect(); set((e.clientX-r.left)/r.width*100); };\n    handle.addEventListener('pointerdown', e => { down=true; handle.setPointerCapture(e.pointerId); e.preventDefault(); });\n    handle.addEventListener('pointermove', e => { if(down) move(e); });\n    handle.addEventListener('pointerup', () => { down=false; });\n    box.addEventListener('click', e => { if(e.target===box) move(e); });\n  }\n\n  langBtn(on){\n    return {padding:'5px 11px', borderRadius:'999px', fontSize:'11px', letterSpacing:'.1em', cursor:'pointer',\n            background: on ? '#8B6F7D' : 'transparent', color: on ? '#FFFFFF' : '#A08D82', transition:'background .2s ease'};\n  }\n  cellStyle(o){\n    const s = {display:'grid', placeItems:'center', width:'100%', aspectRatio:'1', borderRadius:'999px',\n      fontSize:'13px', fontFamily:\"'Jost',sans-serif\", padding:0, background:'transparent', color:'#2E2A28',\n      cursor: o.dis ? 'default' : 'pointer', transition:'background .18s ease, color .18s ease'};\n    if(o.out) s.color = '#DAD1CB';\n    else if(o.dis){ s.color = '#C7BAB3'; if(o.full) s.textDecoration = 'line-through'; }\n    if(o.sel){ s.background = '#8B6F7D'; s.color = '#FFFFFF'; }\n    return s;\n  }\n  chip(on){\n    return {padding:'9px 18px', borderRadius:'999px', fontSize:'13px', letterSpacing:'.03em', cursor:'pointer', whiteSpace:'nowrap',\n      border:'1px solid '+(on?'#8B6F7D':'rgba(201,169,166,.55)'), background:on?'#8B6F7D':'transparent',\n      color:on?'#FFFFFF':'#5C534E', transition:'all .22s ease'};\n  }\n  row(on){\n    return {display:'flex', alignItems:'center', justifyContent:'space-between', gap:'16px', width:'100%',\n      padding:'15px 20px', borderRadius:'18px', cursor:'pointer', textAlign:'start',\n      border:'1px solid '+(on?'#8B6F7D':'rgba(201,169,166,.4)'), background:on?'#F3EAE7':'#FFFFFF',\n      transition:'border-color .2s ease, background .2s ease'};\n  }\n  pill(enabled){\n    return {display:'flex', alignItems:'center', justifyContent:'center', gap:'12px', flex:'1 1 auto',\n      padding:'10px 10px 10px 24px', borderRadius:'999px', fontSize:'14px',\n      background: enabled ? '#8B6F7D' : 'rgba(139,111,125,.32)', color:'#FFFFFF',\n      cursor: enabled ? 'pointer' : 'not-allowed', transition:'background .25s ease'};\n  }\n\n  renderVals(){\n    const lang = this.lang, s = this.state, ar = lang==='ar';\n    const first = this.monthStart();\n    const y = first.getFullYear(), m = first.getMonth();\n    const lead = new Date(y,m,1).getDay();\n    const dim = new Date(y,m+1,0).getDate();\n    const prevDim = new Date(y,m,0).getDate();\n    const today = new Date(); today.setHours(0,0,0,0);\n    const cells = [];\n    for(let i=0;i<42;i++){\n      const n = i-lead+1;\n      let d, out=false;\n      if(n<1){ d = new Date(y,m-1,prevDim+n); out=true; }\n      else if(n>dim){ d = new Date(y,m+1,n-dim); out=true; }\n      else d = new Date(y,m,n);\n      const iso = this.iso(d);\n      const past = d < today;\n      const closed = d.getDay()===5;\n      const full = this.hash(iso)%11===0;\n      const dis = out || past || closed || full;\n      const sel = s.date===iso && !dis;\n      cells.push({key:iso+'#'+i, n:String(d.getDate()), style:this.cellStyle({out,dis,full,sel}),\n        click: dis ? undefined : () => this.setState({date:iso, time:null})});\n    }\n    const monthLabel = first.toLocaleDateString(ar?'ar-DZ':(lang==='en'?'en-GB':'fr-FR'), {month:'long', year:'numeric'});\n    const dateObj = s.date ? new Date(s.date+'T00:00:00') : null;\n    const dateLabel = dateObj ? dateObj.toLocaleDateString(lang==='en'?'en-GB':'fr-FR',{weekday:'long', day:'numeric', month:'long'}) : 'choisissez une date';\n\n    const loc = ar ? 'ar-DZ' : (lang==='en' ? 'en-GB' : 'fr-FR');\n    const strip = [];\n    for(let i=0;i<7;i++){\n      const d = new Date(today); d.setDate(today.getDate() + s.wOff*7 + i);\n      const iso = this.iso(d);\n      const closed = d.getDay()===5;\n      const full = this.hash(iso)%11===0;\n      const dis = closed || full;\n      const sel = s.date===iso && !dis;\n      strip.push({key:iso, n:String(d.getDate()),\n        w: d.toLocaleDateString(loc,{weekday:'narrow'}),\n        style:{display:'flex', flexDirection:'column', alignItems:'center', gap:'3px', padding:'9px 0 10px',\n          borderRadius:'14px', fontFamily:\"'Jost',sans-serif\",\n          border:'1px solid '+(sel?'#8B6F7D':'rgba(201,169,166,.4)'),\n          background: sel ? '#8B6F7D' : (dis ? 'transparent' : '#FFFFFF'),\n          color: sel ? '#FFFFFF' : (dis ? '#C7BAB3' : '#2E2A28'),\n          textDecoration: full && !sel ? 'line-through' : 'none',\n          cursor: dis ? 'default' : 'pointer', transition:'all .2s ease'},\n        click: dis ? undefined : () => this.setState({date:iso, time:null})});\n    }\n    const stripLabel = new Date(today.getFullYear(), today.getMonth(), today.getDate() + s.wOff*7)\n      .toLocaleDateString(loc, {month:'long', year:'numeric'});\n\n    const bookable = [{cat:'Mariée', name:'Location robe de mariée', price:38000, dur:'Essai + retouches inclus'}]\n      .concat(GOWNS.map(g => ({cat:'Mariée', name:'Robe · '+g.n, price:g.p, dur:'Tailles '+g.s})))\n      .concat(SERVICES);\n    const bookableList = bookable.map((x,i) => ({key:'b'+i, name:x.name, meta:x.cat+' · '+x.dur,\n      price: this.prices ? this.fmt(x.price) : 'sur devis', style:this.row(s.svc===x.name),\n      click: () => this.setState({svc:x.name})}));\n\n    const filtered = s.cat==='Tout' ? SERVICES : SERVICES.filter(x => x.cat===s.cat);\n    const svcList = filtered.map((x,i) => ({key:x.name+i, cat:x.cat, name:x.name, desc:x.desc, dur:x.dur,\n      price:this.fmt(x.price), anchor:'service-'+x.name.toLowerCase().replace(/[^a-z0-9]+/g,'-'),\n      click: () => this.setState({open:true, step:0, svc:x.name})}));\n    const catList = CATS.map(c => ({key:c, c, style:this.chip(s.cat===c), click: () => this.setState({cat:c})}));\n\n    const q = s.q.trim().toLowerCase();\n    const groups = CATS.slice(1).concat(['Mariée']).map(g => {\n      let items = g==='Mariée'\n        ? GOWNS.map(x => ({key:'g'+x.n, name:'Location robe · '+x.n, dur:'Tailles '+x.s+' · tier '+x.tier, price:this.fmt(x.p)}))\n            .concat([{key:'p1',name:'Forfait Essential',dur:'Robe + accessoires + coiffure',price:this.fmt(65000)},\n                     {key:'p2',name:'Forfait Signature',dur:'+ maquillage + essai complet',price:this.fmt(95000)},\n                     {key:'p3',name:'Forfait Couture',dur:'+ robe de soirée + soins + shooting',price:this.fmt(140000)}])\n        : SERVICES.filter(x => x.cat===g).map((x,i) => ({key:g+i, name:x.name, dur:x.dur+' · '+x.desc, price:this.fmt(x.price)}));\n      if(q) items = items.filter(it => (it.name+' '+it.dur).toLowerCase().includes(q));\n      return {key:g, g, items, count:items.length+' prestations', open: q ? true : s.grp===g,\n        chev: (q||s.grp===g) ? 'M6 15l6-6 6 6' : 'M6 9l6 6 6-6',\n        click: () => this.setState({grp: s.grp===g ? null : g})};\n    }).filter(gr => gr.items.length>0);\n\n    const slotList = (s.date ? this.slotsOf(s.date) : []).map(x => ({key:x.t, t:x.t,\n      style:{padding:'10px 16px', borderRadius:'12px', fontSize:'14px',\n        border:'1px solid '+(s.time===x.t?'#8B6F7D':'rgba(201,169,166,.5)'),\n        background: s.time===x.t ? '#8B6F7D' : (x.taken ? 'rgba(201,169,166,.14)' : '#FFFFFF'),\n        color: s.time===x.t ? '#FFFFFF' : (x.taken ? '#C7BAB3' : '#2E2A28'),\n        textDecoration: x.taken ? 'line-through' : 'none',\n        cursor: x.taken ? 'not-allowed' : 'pointer', transition:'all .2s ease'},\n      click: x.taken ? undefined : () => this.setState({time:x.t})}));\n\n    const canNext = [!!s.svc, !!s.expert, !!(s.date && s.time), !!(s.nm.trim() && s.ph.trim()), true][s.step];\n    const summary = [s.svc, s.expert && 'avec '+s.expert, dateObj && dateLabel, s.time, s.nm && '· '+s.nm, s.ph]\n      .filter(Boolean).join(' · ');\n    const waNum = this.props.whatsapp || '213661234567';\n\n    const bookGown = g => () => this.setState({open:true, step:2, svc:'Robe · '+g, date:this.state.date});\n\n    return {\n      rootRef:this.rootRef, heroRef:this.heroRef, stickyRef:this.stickyRef,\n      baRef:this.baRef, baTopRef:this.baTopRef, baHandleRef:this.baHandleRef,\n      isFr: lang==='fr', isAr: ar, isEn: lang==='en',\n      motion: (this.props.heroMotion||'immersive')==='immersive',\n      showPrices: this.prices,\n      setFr: () => this.setState({lang:'fr'}), setAr: () => this.setState({lang:'ar'}), setEn: () => this.setState({lang:'en'}),\n      sFr: this.langBtn(lang==='fr'), sAr: this.langBtn(ar), sEn: this.langBtn(lang==='en'),\n      cells, monthLabel, dateLabel, strip, stripLabel,\n      prevWeek: () => this.setState({wOff:Math.max(0,this.state.wOff-1)}),\n      nextWeek: () => this.setState({wOff:this.state.wOff+1}),\n      prevMonth: () => this.setState({mOff:this.state.mOff-1}),\n      nextMonth: () => this.setState({mOff:this.state.mOff+1}),\n      availabilityNote: ar ? 'الجمعة مغلق · التواريخ المشطوبة محجوزة' : (lang==='en' ? 'Closed Fridays · struck-through dates are full' : 'Vendredi fermé · les dates barrées sont complètes'),\n      open:s.open, step:s.step, stepNo:s.step+1, stepTitle:STEPS[s.step],\n      atService:s.step===0, atExpert:s.step===1, atDate:s.step===2, atDetails:s.step===3, atDone:s.step===4,\n      showNav:s.step<4,\n      progress: STEPS.map((_,i) => ({key:'p'+i, style:{flex:'1 1 0', height:'3px', borderRadius:'999px',\n        background: i<=s.step ? '#8B6F7D' : 'rgba(201,169,166,.35)', transition:'background .3s ease'}})),\n      openBooking: () => this.setState({open:true, step:0}),\n      closeBooking: () => this.setState({open:false}),\n      back: () => this.setState({step:Math.max(0,this.state.step-1)}),\n      next: () => { if(canNext) this.setState({step:Math.min(4,this.state.step+1)}); },\n      backStyle:{padding:'12px 24px', borderRadius:'999px', fontSize:'14px', cursor:'pointer',\n        border:'1px solid rgba(201,169,166,.55)', color:'#5C534E', opacity:s.step===0?.4:1},\n      nextStyle:this.pill(canNext),\n      nextLabel: s.step===3 ? 'Confirmer la réservation' : 'Continuer',\n      bookableList, expertList: EXPERTS.map(e => ({key:e.n, n:e.n, r:e.r, initial:e.n[0],\n        style:Object.assign(this.row(s.expert===e.n), {justifyContent:'flex-start'}),\n        click: () => this.setState({expert:e.n})})),\n      slotList, summary: summary || 'Complétez les étapes précédentes.',\n      nameVal:s.nm, phoneVal:s.ph, notesVal:s.nt,\n      setName: e => this.setState({nm:e.target.value}),\n      setPhone: e => this.setState({ph:e.target.value}),\n      setNotes: e => this.setState({nt:e.target.value}),\n      waLink: 'https://wa.me/'+waNum+'?text='+encodeURIComponent('Bonjour N&S, je souhaite confirmer : '+(summary||'un rendez-vous')),\n      stickyLabel: ar ? 'احجزي موعدكِ' : (lang==='en' ? 'Book your appointment' : 'Réserver mon rendez-vous'),\n      svcList, catList, groups,\n      serviceCount: filtered.length + (filtered.length>1 ? ' prestations affichées' : ' prestation affichée'),\n      searchVal:s.q, setSearch: e => this.setState({q:e.target.value}),\n      bookAnastasia: bookGown('Anastasia'), bookAbir: bookGown('ABir'), bookRyma: bookGown('RYMA'),\n      gownA: this.fmt(45000), gownB: this.fmt(38000), gownC: this.fmt(55000),\n      packA: this.fmt(65000), packB: this.fmt(95000), packC: this.fmt(140000)\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
